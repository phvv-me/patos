name: CI

on:
  pull_request:
  workflow_call: # publish.yml runs this exact gate on main before publishing
  workflow_dispatch: # manual runs (e.g. to validate main directly between releases)

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The core patterns run on 3.13 and `requires-python` says so, but this job installs
        # the `sql` extra, which reaches PEP 750 template strings and `uuid.uuid7`. Both
        # arrived in 3.14, so the full suite only has one interpreter to run on.
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v6
      # A published package stands on its own, so the bootstrap is the official uv action and
      # nothing of ours. A shared house action would make every release depend on another
      # repository's default branch, which is the coupling this file exists to avoid.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      # One sync names every extra the gate needs, and the `uv run` steps below reuse that
      # environment without pruning it. `torch` is here because `tests/test_torch.py` only
      # collects where the extra is installed, so leaving it out would silently skip a suite.
      - run: uv sync --extra dev --extra sql --extra torch
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyrefly check
      - run: uv run ty check --error-on-warning
      - run: uv run pytest --cov=patos
