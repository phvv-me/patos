name: CI

on:
  pull_request:
  workflow_call: # publish.yml runs this exact gate on main before publishing
  workflow_dispatch: # manual runs (e.g. to validate main directly between releases)

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The core patterns run on 3.13 and `requires-python` says so, but this job installs
        # the `sql` extra, which reaches PEP 750 template strings and `uuid.uuid7`. Both
        # arrived in 3.14, so the full suite only has one interpreter to run on.
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v6
      # the shared chefe action owns the uv version, the cache paths and the cache key in one
      # place instead of each repository hand rolling its own
      - uses: phvv-me/chefe/.github/actions/setup@main
        with:
          mode: uv
          extras: dev sql
          python-version: ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyrefly check
      - run: uv run ty check --error-on-warning
      - run: uv run pytest --cov=patos
