[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patos"
version = "0.0.14"
description = "Typed Python design and dispatch patterns, pip one in or copy one in and own the file"
readme = "README.md"
# The core patterns run on 3.13, which is what the monorepo's GPU `serving` environment needs,
# since sglang ships no CPython 3.14 wheel and that environment imports Strategy, Registry and
# SingletonMeta. The `sql` extra is the one part that still requires 3.14, because
# `sql/templates.py` imports `string.templatelib` (PEP 750) and `PK(UUID7)` calls `uuid.uuid7`,
# neither of which exists before 3.14. Extras cannot carry their own floor, so install
# `patos[sql]` on 3.14 only.
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Pedro Valois", email = "contact@phvv.me" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
# Every pure pato is stdlib and copies cleanly into your own repo. The one exception is
# `bases`, the pydantic house models the flock shares, so pydantic is the sole runtime dep.
dependencies = ["pydantic>=2.13.4,<3"]

[project.optional-dependencies]
# `patos.cuda` writes device code on numba-cuda, launches it through cuda.core, scans through
# cuda.compute and takes CuPy as the array module, at the floors cutok was proven on.
cuda = [
  "cuda-cccl[cu13]>=1.2.1,<2",
  "cuda-core>=1.1.1,<2",
  "cupy-cuda13x>=14.1.1,<15",
  "numba-cuda>=0.30.4,<0.31",
  "numpy>=2",
]
# `patos.torch` is the one namespace that touches an accelerator stack, so it stays behind an
# extra the way `sql` does. The torch floor is deliberately loose, since nothing here reaches
# past `manual_seed`, `finfo`, `eye` and the matmul precision switches, and a consumer already
# pins the exact build its CUDA lane needs. numpy joins it because `seed_all` seeds numpy too
# and torch itself does not require numpy.
torch = [
  "numpy>=1.26",
  "torch>=2",
]
sql = [
  "inflection>=0.5.1,<0.6",
  "pgvector>=0.5,<0.6",
  "sqlalchemy>=2.1.0b3,<3",
  "sqlmodel>=0.0.39,<0.1",
  "typing-extensions>=4.15,<5",
]
dev = [
  "hypothesis>=6",
  "pyrefly>=1.1.1",
  "pytest>=9",
  "pytest-cov>=5",
  "pytest-randomly>=3",
  "ruff>=0.15",
  "sqlmodel>=0.0.39,<0.1",
  "ty>=0.0.86,<0.1",
]
docs = [
  "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://phvv.me/patos"
Repository = "https://github.com/phvv-me/patos"
Issues = "https://github.com/phvv-me/patos/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/patos"]

[tool.uv]
override-dependencies = ["sqlalchemy>=2.1.0b3,<3"]

[tool.ruff]
line-length = 99
# Stays at the `sql` extra's floor rather than the core's, because a single target cannot say
# "core is 3.13, this one extra is 3.14" and `sql/templates.py` plus `test_sql.py` genuinely need
# 3.14 for PEP 750 t-strings. The cost is that the formatter would rewrite `except (A, B, C):`
# into PEP 758's unparenthesized form, which 3.13 cannot parse, so the core avoids writing a
# multi-exception `except` at all and names the tuple instead. See `flyweight.py`.
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"dataclasses".msg = "Declare a value with patos.bases: Model, FrozenModel, FlexModel or FrozenFlexModel."

[tool.ruff.format]
# MkDocs include directives inside Python fences are not Python expressions.
exclude = ["*.md"]

[tool.pyrefly]
project-includes = ["src", "tests", "typing"]
search-path = ["src", "tests", "typing", ".", "stubs"]
# The `torch` and `cuda` extras are not installed in the gate, so their imports are absent there
# rather than wrong. Naming exactly those keeps every other unresolved import an error.
ignore-missing-imports = ["numpy", "torch", "numba", "numba.*", "llvmlite", "llvmlite.*", "cuda.*", "cupy", "cupy.*"]
# `stubs/numba/cuda` types numba-cuda's device API as device code reads it, so `numba.cuda`
# resolves there. The rest of numba and llvmlite reads as untyped whether the extra is installed or
# not: the numba a checker finds is upstream's built-in CUDA target, not the numba-cuda that runs.
# With cupy and cuda-python, the verdict is the same on every host and rests on the code that
# calls them. A glob here takes its own module too, so `numba.cuda`'s submodules are each named.
replace-imports-with-any = [
  "numba", "numba.types.*", "numba.core.*", "numba.np.*", "numba.cuda.cgutils",
  "numba.cuda.codegen", "numba.cuda.core.*", "numba.cuda.cudadecl", "numba.cuda.cudadrv.*",
  "numba.cuda.cudaimpl", "numba.cuda.dispatcher", "numba.cuda.extending", "numba.cuda.libdevice",
  "numba.cuda.np.*", "numba.cuda.target", "numba.cuda.typing.*", "llvmlite", "llvmlite.*", "cupy",
  "cupy.*", "cuda.*",
]

# A lane operation passes a word where lanes are declared, an int literal where a `u32` is, and
# returns a word where lanes are, because `device` converts every argument and return.
[[tool.pyrefly.sub-config]]
matches = "src/patos/cuda/primitives/bits.py"

[tool.pyrefly.sub-config.errors]
bad-argument-type = false
bad-return = false

[tool.ty.environment]
python-version = "3.14"
root = ["src", "typing"]
extra-paths = ["stubs"]

[tool.ty.src]
include = ["src", "typing"]

# The same reading of the CUDA stack as pyrefly's `replace-imports-with-any` above. Here a glob
# takes only the modules below its own, so `numba.cuda.*` leaves the stubbed `numba.cuda` typed,
# and `numba` stays resolvable for `from numba import cuda`.
[tool.ty.analysis]
replace-imports-with-any = [
  "numba.types", "numba.types.*", "numba.core.*", "numba.np.*", "numba.cuda.*", "llvmlite",
  "llvmlite.*", "cupy", "cupy.*", "cuda.*",
]

# Same optional-extra gap as the pyrefly setting above, scoped to the only files that import it.
[[tool.ty.overrides]]
include = ["src/patos/torch/**", "src/patos/cuda/**"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

# The same converted arguments and returns as pyrefly's `bits.py` sub-config above.
[[tool.ty.overrides]]
include = ["src/patos/cuda/primitives/bits.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-return-type = "ignore"

# mcmr reads a Numba CUDA function only through a literal `cuda.jit` decorator, so `device` and
# `kernel`, which wrap it, earn none of its device-code exemptions. Each entry names its reason.

# patos.cuda is a library whose callers (cutoken) live outside this checkout, so a protocol or a
# public function with no reference here is reached from there.
[tool.mcmr.rules."ALL-ARCH0005"]
exclude = ["src/patos/cuda/runtime/streams.py"]

# The backend is the one package meant to import numba-cuda's internals and cuda.core's private
# error type; every other module reaches them through it. The house models extend pydantic's model
# metaclass, which pydantic exports from no public module.
[tool.mcmr.rules."PY-IMPO0007"]
fence = ["src/patos/cuda/backend/**", "src/patos/bases.py"]

# `device` and `ptx` hand back numba's dispatcher or intrinsic typed as the function it
# compiles, so device code calling it is checked against the callee's own signature; the cast states
# that on purpose.
[tool.mcmr.rules."PY-TYPE0009"]
exclude = ["src/patos/cuda/backend/decorators.py", "src/patos/cuda/backend/intrinsics.py"]

# The package surfaces callers outside this checkout (cutoken) import from.
[tool.mcmr.rules."PY-MODU0005"]
exclude = [
  "src/patos/cuda/primitives/__init__.py",
  "src/patos/cuda/runtime/__init__.py",
  "src/patos/cuda/typed.py",
]

# Published functions of the same library, called from cutoken.
[tool.mcmr.rules."ALL-REAC0001"]
exclude = [
  "src/patos/cuda/runtime/memory.py",
  "src/patos/cuda/hashing.py",
  "src/patos/cuda/primitives/hash.py",
  "src/patos/cuda/runtime/streams.py",
]

# `pair_key`, `splitmix` and `table_capacity` are defined here and called from cutoken.
[tool.mcmr.rules."ALL-REAC0002"]
exclude = ["src/patos/cuda/hashing.py"]

# Kernels read a module global as a compile-time constant, so `EMPTY_KEY` and the splitmix
# constants stay public in the host module that owns them and the device modules import them by name.
[tool.mcmr.rules."PY-CONS0001"]
exclude = ["src/patos/cuda/hashing.py"]

# The device hash and the package surface take those constants by name for the same reason.
[tool.mcmr.rules."PY-CONS0002"]
exclude = ["src/patos/cuda/primitives/__init__.py", "src/patos/cuda/primitives/hash.py"]

# The typed tests pin the arithmetic rules, the declarations and the marshalling in the modules
# that define them, which the package surface does not re-export.
[tool.mcmr.rules."PY-IMPO0005"]
exclude = ["tests/test_cuda_types.py"]

# The type fixtures sit in a directory named `typing`, which reads `from typing import assert_type`
# as an import of the package's own.
[tool.mcmr.rules."PY-IMPO0001"]
exclude = ["typing/**"]

# A declared tuple type is a tuple reading that `isinstance` tells from every other, and
# `Signature` is frozen, as are the parameter types that key a dispatched name's implementations:
# these tuples are the domain, not a choice of collection.
[tool.mcmr.rules."PY-COLL0004"]
exclude = [
  "src/patos/cuda/front/declarations.py",
  "src/patos/cuda/backend/decorators.py",
  "src/patos/cuda/backend/intrinsics.py",
  "src/patos/cuda/backend/overloads.py",
  "src/patos/cuda/front/reading.py",
  "src/patos/cuda/front/rewrite.py",
]

# The same tuples as the fields of the frozen models that hold them, hashed and compared.
[tool.mcmr.rules."PY-PYDA0007"]
exclude = ["src/patos/cuda/front/declarations.py"]

# The type reader meets AST constants as `bool` and `int`, a representation boundary.
[tool.mcmr.rules."PY-INTE0001"]
exclude = [
  "src/patos/cuda/front/declarations.py",
  "src/patos/cuda/front/reading.py",
  "src/patos/cuda/front/rewrite.py",
]

# `left` and `right`, or `a` and `b`, are the operands of a binary operator, and `operand`, `other`,
# `target` and `value` the AST nodes of an operation or a store. The bit and byte primitives keep the operand
# order of the CUDA intrinsics they mirror (`__funnelshift_r(lo, hi, shift)`, `__dp4a`), and so
# do the tests' stand-ins for them; a test kernel takes its input and output arrays; a Numba cast
# takes the types it converts between. A division takes its dividend before its divisor as `//`
# does, and a copy or a comparison names each array beside its offset and the count last. The
# numba stubs keep numba-cuda's own parameter order.
[tool.mcmr.rules."ALL-PARA0001"]
exclude = [
  "stubs/**",
  "src/patos/cuda/front/arithmetic.py",
  "src/patos/cuda/front/checks.py",
  "src/patos/cuda/backend/lanes.py",
  "src/patos/cuda/front/rewrite.py",
  "tests/test_cuda_cxx.py",
  "tests/test_cuda_primitives.py",
  "tests/test_cuda_simd.py",
  "src/patos/cuda/primitives/hash.py",
  "src/patos/cuda/primitives/bits.py",
  "src/patos/cuda/primitives/bytewise.py",
  "src/patos/cuda/primitives/integers.py",
  "src/patos/cuda/primitives/memory.py",
  "src/patos/cuda/primitives/monoid.py",
  "src/patos/cuda/primitives/warp.py",
]

# `ballot_prefix(flag)` is a device function that cutoken's kernels call positionally.
[tool.mcmr.rules."ALL-PARA0003"]
exclude = ["src/patos/cuda/primitives/warp.py"]

# The typed and primitives test modules keep their records, kernels and helpers beside the
# scenarios that use them.
[tool.mcmr.rules."ALL-MODU0001"]
exclude = ["tests/test_cuda_primitives.py", "tests/test_cuda_types.py"]

# The same closed families: each module keeps its record or protocol beside the one class using it,
# the declaration forms sit together, an error beside the reading that raises it, the AST pass
# beside the rewrite driving it, and the record metaclass beside its one base. A C++ unit sits
# beside its compiler and headers, a lane type beside its model and the store it types, and a
# numeric declaration beside the protocol it types. The hash records share one hash and one cuco
# unit, and a block's operations and a monoid sit beside the protocols that type them. Numba
# registers a type, its data model and each typing template as a class of its own, so a record's
# device type keeps them together, a kernel keeps what it runs per item and its bound form, a
# device function its member form, and the marshalling the array interface it reads.
[tool.mcmr.rules."ALL-MODU0005"]
exclude = [
  "src/patos/cuda/primitives/block.py",
  "src/patos/cuda/primitives/hash.py",
  "src/patos/cuda/primitives/monoid.py",
  "src/patos/cuda/runtime/memory.py",
  "src/patos/cuda/runtime/streams.py",
  "src/patos/cuda/scalars.py",
  "src/patos/cuda/backend/arguments.py",
  "src/patos/cuda/backend/cxx.py",
  "src/patos/cuda/backend/decorators.py",
  "src/patos/cuda/backend/kernels.py",
  "src/patos/cuda/backend/records.py",
  "src/patos/cuda/front/declarations.py",
  "src/patos/cuda/backend/lanes.py",
  "src/patos/cuda/front/reading.py",
  "src/patos/cuda/front/rewrite.py",
  "src/patos/cuda/front/record.py",
  "tests/test_cuda_types.py",
]

# The same, counted in statements, and the numba stubs (see ALL-MODU0002 below).
[tool.mcmr.rules."ALL-MODU0006"]
exclude = [
  "stubs/**",
  "tests/test_cuda_primitives.py",
  "tests/test_cuda_simd.py",
  "tests/test_cuda_types.py",
]

# The house testing policy is maximum coverage from minimum test count: a test is one dense
# scenario, and its helpers and fakes share the module. Splitting to the ceilings would multiply
# the tests.
[tool.mcmr.rules."ALL-TEST0003"]
exclude = ["tests/test_cuda_primitives.py", "tests/test_cuda_simd.py", "tests/test_cuda_types.py"]

# `executed` compiles a template into a namespace, the only way to hand `inspect.getsource` device
# code that carries the annotations under test, and the members test reads a host class's `vars`.
# A class's device members, some wrapped in `property`, are found in its own namespace, and Numba's
# `overload` jits the function it is handed, which only `exec` can give the member's parameters.
# The purity test reads every PTX stub a primitive module defines from the module's `vars`, and a
# kernel's sources are found by following each module's globals, read from its `vars`.
[tool.mcmr.rules."ALL-FUNC0011"]
exclude = [
  "src/patos/cuda/sources.py",
  "src/patos/cuda/backend/decorators.py",
  "src/patos/cuda/backend/records.py",
  "tests/test_cuda_simd.py",
  "tests/test_cuda_types.py",
]

# patos is a published library: it logs through the standard `logging` its caller configures.
[tool.mcmr.rules."PY-LOGG0001"]
exclude = ["src/patos/cuda/backend/cxx.py", "src/patos/cuda/backend/kernels.py"]

# Each lane operation and each warp reduction is one name over an implementation per type, and
# the stub type checkers read, kept beside each other, and so is each monoid's operator beside its
# identity. The numba stubs declare numba-cuda's whole
# `numba.cuda` namespace in the one module a checker reads it from: ty reads a stub submodule of
# it as `Any`, since its `replace-imports-with-any` above names `numba.cuda.*`.
[tool.mcmr.rules."ALL-MODU0002"]
exclude = [
  "src/patos/cuda/primitives/bits.py",
  "src/patos/cuda/primitives/monoid.py",
  "src/patos/cuda/primitives/warp.py",
  "stubs/**",
]

# A block's operations are the closures over its warp count, which the loops over its warps unroll
# by, so `over` defines each of them in its body.
[tool.mcmr.rules."ALL-FUNC0001"]
exclude = ["src/patos/cuda/primitives/block.py"]

# `met` is the rules read over Numba's types, which the tests pin against `meet`, so it stays a
# module function they import rather than moving into the typing rule that calls it.
[tool.mcmr.rules."ALL-FUNC0003"]
ignore_names = ["met"]

# The initializer of a namespace package holds its docstring and nothing else.
[tool.mcmr.rules."PY-MODU0002"]
exclude = [
  "src/patos/cuda/__init__.py",
  "src/patos/cuda/backend/__init__.py",
  "src/patos/cuda/front/__init__.py",
]

# `patos.cuda.typed` is the surface of the front and the backend, the one module that names what
# callers import from it.
[tool.mcmr.rules."PY-MODU0004"]
exclude = ["src/patos/cuda/typed.py"]

# The stub of `numba.cuda` sits where the module path puts it, `stubs/numba/cuda`, which leaves
# `stubs/numba` holding nothing but that directory.
[tool.mcmr.rules."ALL-FILE0004"]
exclude = ["stubs/numba"]

# The numba stubs type numba-cuda's API as it stands: its names (`all_sync` answers a Boolean), its
# `shape` tuples, whose length is the rank of the array they allocate, and the `bool | None`
# options that defer to its configuration.
[tool.mcmr.rules."PY-COLL0001"]
exclude = ["stubs/**"]

[tool.mcmr.rules."PY-NAMI0001"]
exclude = ["stubs/**"]

[tool.mcmr.rules."PY-TYPE0002"]
exclude = ["stubs/**"]

[tool.pytest.ini_options]
strict = true
addopts = "-q -ra --strict-markers"
testpaths = ["tests"]

# The standalone GitHub workflow runs these same commands with the package's locked tools.
[tool.mainboard.ci]
os = ["linux", "osx"]

[[tool.mainboard.ci.steps]]
name = "sync"
run = "uv sync --locked --extra dev --extra sql --extra torch"
timeout = 300

[[tool.mainboard.ci.steps]]
name = "lint"
run = "uv run --locked ruff check ."
timeout = 60

[[tool.mainboard.ci.steps]]
name = "format"
run = "uv run --locked ruff format --check ."
timeout = 60

[[tool.mainboard.ci.steps]]
name = "pyrefly"
run = "uv run --locked pyrefly check"
timeout = 120

[[tool.mainboard.ci.steps]]
name = "ty"
run = "uv run --locked ty check --error-on-warning"
timeout = 120

[[tool.mainboard.ci.steps]]
name = "tests"
run = "uv run --locked pytest --cov=patos"
timeout = 1200

[tool.coverage.run]
source = ["patos"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "@overload",
  "\\.\\.\\.",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
